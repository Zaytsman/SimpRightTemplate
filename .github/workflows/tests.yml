name: Tests

# Runs both Playwright projects, headless, and keeps the HTML report as an artifact.
# The examples need no secrets. When your tests do, add each one by name to the "Run tests" step's env
# (ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}); src/envs/<ENV>.json reads it as a ${ADMIN_PASSWORD} placeholder.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # No dependency needs an install script.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npm run install:browsers

      - name: Run tests
        run: npx playwright test

      # Warns (an annotation per test) when a test's step titles aren't its scenario's steps verbatim. It runs after
      # failed tests too, and never fails the job.
      - name: Check step titles
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run check:step-titles

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
